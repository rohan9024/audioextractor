[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audioextract"
version = "0.2.1"
description = "Production-safe audio extraction for Python media and AI pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rohan R. Wandre" }]
keywords = ["audio", "video", "ffmpeg", "ffprobe", "fastapi", "transcription", "whisper", "media"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "build>=1.2",
  "twine>=5",
  "ruff>=0.8",
]

[project.scripts]
audioextract = "audioextract.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_GITHUB_USERNAME/audioextract"
Repository = "https://github.com/YOUR_GITHUB_USERNAME/audioextract"
Issues = "https://github.com/YOUR_GITHUB_USERNAME/audioextract/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audioextract = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
